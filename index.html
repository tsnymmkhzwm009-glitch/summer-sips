<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Sips | مشروبات صيفية منعشة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- الهيدر مع زر الوضع المظلم -->
        <div class="header">
            <h1><i class="fas fa-umbrella-beach"></i> Summer Sips <i class="fas fa-cocktail"></i></h1>
            <button id="themeToggle" class="theme-btn">
                <i class="fas fa-moon"></i> الوضع المظلم
            </button>
        </div>

        <!-- فلتر المشروبات -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="fruit-juice"><i class="fas fa-apple-alt"></i> عصير فواكه</button>
            <button class="filter-btn" data-filter="mocktail"><i class="fas fa-lemon"></i> كوكتيل</button>
            <button class="filter-btn" data-filter="smoothie"><i class="fas fa-blender"></i> Smoothie</button>
            <button class="filter-btn" data-filter="ice-cream"><i class="fas fa-ice-cream"></i> مثلجات</button>
        </div>

        <!-- زر المشروب العشوائي -->
        <div class="random-section">
            <button id="randomBtn" class="random-btn"><i class="fas fa-dice-d6"></i> مشروب عشوائي اليوم</button>
        </div>

        <!-- عرض البطاقات -->
        <div id="drinksContainer" class="drinks-container">
            <!-- سيتم إضافة المشروبات هنا بواسطة JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
